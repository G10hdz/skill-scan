<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>skill-scan — arquitectura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 0.4rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>skill-scan — preflight de solo lectura</h1>
    <p class="sub">Dos herramientas: skill_scan revisa plugins antes de instalarlos; leak_gate corta prompts antes de que salgan a una API frontier.</p>

    <svg viewBox="0 0 1100 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ss-title ss-desc">
      <title id="ss-title">skill-scan y leak-gate</title>
      <desc id="ss-desc">skill_scan.py escanea un directorio de skill o roots conocidos, decodifica base64 y hex, marca caracteres ocultos y produce PASS, REVIEW o BLOCK con exit codes 0, 1, 2; leak_gate.py revisa prompts contra watchwords y puede servir como proxy localhost con modo redact; el ledger guarda solo hashes SHA-256.</desc>
      <defs>
        <marker id="ss-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="ss-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1100" height="470" fill="#f5f5f5"/>

      <!-- skill_scan lane -->
      <rect x="40" y="50" width="1030" height="180" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="555" y="74" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SKILL_SCAN.PY — TARGET ES DATOS, NO INSTRUCCIONES</text>

      <rect x="70" y="90" width="220" height="60" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="180" y="114" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">skill dir o roots</text>
      <text x="180" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude · codex · cursor · pi · .agents</text>

      <rect x="340" y="90" width="280" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="480" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">decode + reglas</text>
      <text x="480" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">base64/hex · bidi · zero-width · unicode tags</text>

      <rect x="670" y="90" width="180" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">veredicto</text>
      <text x="760" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PASS 0 / REVIEW 1 / BLOCK 2</text>

      <rect x="880" y="90" width="160" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="960" y="114" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">--json --inventory</text>
      <text x="960" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SHA-256 por archivo</text>

      <path d="M 290 120 L 340 120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ss-arrow)"/>
      <path d="M 620 120 L 670 120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ss-arrow)"/>
      <path d="M 850 120 L 880 120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ss-arrow)"/>
      <text x="180" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">solo lectura — no ejecuta, no modifica, no envia</text>

      <!-- leak_gate lane -->
      <rect x="40" y="250" width="1030" height="180" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.35)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="555" y="274" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LEAK_GATE.PY — PREFLIGHT DE PROMPTS (LOCALHOST ONLY)</text>

      <rect x="70" y="290" width="220" height="60" rx="6" fill="rgba(79,93,117,0.06)" stroke="#7a8399" stroke-width="1"/>
      <text x="180" y="314" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">draft / stdin</text>
      <text x="180" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">check · stamp · serve · wrap</text>

      <rect x="340" y="290" width="280" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="480" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">watchwords + secrets</text>
      <text x="480" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~/.leak-gate/watchwords.txt · re: regex</text>

      <rect x="670" y="290" width="180" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">proxy :8787</text>
      <text x="760" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--mode redact → restaura</text>

      <rect x="880" y="290" width="160" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.32)" stroke-width="0.8"/>
      <text x="960" y="314" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ledger</text>
      <text x="960" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">guarda hash, no prompt</text>

      <path d="M 290 320 L 340 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ss-arrow)"/>
      <path d="M 620 320 L 670 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ss-arrow)"/>
      <path d="M 850 320 L 880 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ss-arrow)"/>
      <text x="555" y="390" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">si el request no parsea, no se reenvia · PASS no prueba seguridad — un gate no sustituye un modelo local</text>
    </svg>
  </div>
</body>
</html>
